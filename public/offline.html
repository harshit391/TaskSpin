<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <title>TaskSpin — Offline</title>
  <link rel="icon" href="/favicon-32x32.png" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
      background: #000; color: #f5f5f5; padding: 24px;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { text-align: center; max-width: 360px; }
    img { width: 56px; height: 56px; border-radius: 12px; margin-bottom: 20px; }
    h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; letter-spacing: 0.02em; text-transform: uppercase; }
    h1 span { color: #FF2D6F; }
    p { margin: 0 0 24px; font-size: 14px; line-height: 1.5; color: #9a9a9a; }
    button {
      background: #FF2D6F; color: #fff; border: 0; border-radius: 4px; padding: 12px 20px; min-height: 44px;
      font-size: 14px; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; cursor: pointer;
    }
    button:focus-visible { outline: 2px solid #FF2D6F; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <img src="/android-chrome-192x192.png" alt="TaskSpin" />
    <h1>You're <span>offline</span></h1>
    <p>TaskSpin needs a connection to sync your tasks. Check your network and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>
    // Come back automatically once the connection returns
    window.addEventListener("online", () => location.reload());
  </script>
</body>
</html>
